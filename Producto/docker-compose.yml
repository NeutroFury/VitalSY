services:

  # ── PostgreSQL Database ──
  vitalsy-db:
    image: postgres:17-alpine
    container_name: vitalsy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vitalsy_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - vitalsy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vitalsy_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vitalsy-network

  # ── Spring Boot Backend ──
  vitalsy-backend:
    build:
      context: ./vitalsy-backend
      dockerfile: Dockerfile
    container_name: vitalsy-backend
    restart: unless-stopped
    environment:
      # Override datasource — defaults to local container, overridable via .env
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://vitalsy-db:5432/${POSTGRES_DB:-vitalsy_db}}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${POSTGRES_USER:-postgres}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}
      # JWT (Spring relaxed binding: jwt.secret → JWT_SECRET)
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production-vitalsy-2024}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      # AI / Gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SPRING_AI_OPENAI_BASE-URL: ${SPRING_AI_OPENAI_BASE_URL:-http://host.docker.internal:1234}
      SPRING_AI_OPENAI_API-KEY: ${SPRING_AI_OPENAI_API_KEY:-vitalsy-local}
      # Mail (Mailtrap)
      MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8100}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      vitalsy-db:
        condition: service_healthy
    networks:
      - vitalsy-network

  # ── Ionic/Angular Frontend (Nginx) ──
  vitalsy-frontend:
    build:
      context: ./vitalsy-ionic
      dockerfile: Dockerfile
    container_name: vitalsy-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - vitalsy-backend
    networks:
      - vitalsy-network

volumes:
  vitalsy-pgdata:
    driver: local

networks:
  vitalsy-network:
    driver: bridge
