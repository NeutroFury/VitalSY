spring.application.name=vitalsy-backend

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool — Fija la zona de cada conexión a UTC al abrirse
# Esto protege contra cualquier default de zona del servidor Supabase
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA Configuration
# IMPORTANTE: Flyway gestiona el esquema. Hibernate solo valida, nunca modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Integridad de Timestamps (CRÍTICO para línea de tiempo cronológica) ---
# Le indica a Hibernate que negocie la sesión JDBC en UTC.
# PostgreSQL almacena TIMESTAMPTZ siempre en UTC internamente; este parámetro
# garantiza que Hibernate no aplique conversiones adicionales al bind de parámetros.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Tipo JDBC preferido para Instant/ZonedDateTime en Hibernate 6
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baselineOnMigrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# Logging Configuration
logging.level.root=INFO
logging.level.com.jonesys.vitalsy=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# AI Configuration
# (Se eliminaron las referencias a Gemma/Spring AI. Se usa Gemini API exclusivamente)

# Gemini API Configuration (Google AI Studio)
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent
gemini.api.key=${GEMINI_API_KEY:vitalsy-local-gemini-key-2026}

# ============================================================
# Mail Configuration (Mailtrap - Simulación SMTP)
# ============================================================
# Obtén tus credenciales en https://mailtrap.io -> Email Testing -> SMTP Settings
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:tu_usuario_mailtrap}
spring.mail.password=${MAIL_PASSWORD:tu_password_mailtrap}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

# Remitente del correo de recuperación
app.mail.from=no-reply@vitalsy.app

# URL base del frontend Ionic (para el enlace en el correo)
app.frontend.url=${FRONTEND_URL:http://localhost:8100}
