<ion-app>
  <ion-router-outlet></ion-router-outlet>

  <!-- Global Navigation Bar (fixed at bottom) -->
  @if ((isLoggedIn$ | async) && showTabs) {
    <div class="fixed bottom-0 left-0 w-full bg-surface border-t border-secondary/20 px-2 sm:px-6 pt-2 z-[9999] flex justify-around sm:justify-between items-center shadow-[0_-4px_20px_rgba(0,0,0,0.05)]" style="padding-bottom: calc(env(safe-area-inset-bottom) + 12px);">
      <button (click)="navigateTo('dashboard')" 
              class="flex flex-col items-center gap-1 active:scale-95 transition-all bg-transparent border-none outline-none"
              [class.text-primary]="currentRoute === 'dashboard'"
              [class.text-secondary]="currentRoute !== 'dashboard'"
              [class.hover:text-text]="currentRoute !== 'dashboard'">
        <div class="w-12 h-10 sm:w-12 sm:h-12 rounded-2xl flex items-center justify-center transition-colors"
             [class.bg-primary/10]="currentRoute === 'dashboard'">
          <ion-icon name="pulse-outline" class="text-xl sm:text-2xl"></ion-icon>
        </div>
      </button>
      <button (click)="navigateTo('history')" 
              class="flex flex-col items-center gap-1 active:scale-95 transition-all bg-transparent border-none outline-none"
              [class.text-primary]="currentRoute === 'history'"
              [class.text-secondary]="currentRoute !== 'history'"
              [class.hover:text-text]="currentRoute !== 'history'">
        <div class="w-12 h-10 sm:w-12 sm:h-12 rounded-2xl flex items-center justify-center transition-colors"
             [class.bg-primary/10]="currentRoute === 'history'">
          <ion-icon name="time-outline" class="text-xl sm:text-2xl"></ion-icon>
        </div>
      </button>
      <button (click)="navigateTo('registro')" 
              class="flex flex-col items-center gap-1 active:scale-95 transition-all bg-transparent border-none outline-none"
              [class.text-primary]="currentRoute === 'registro'"
              [class.text-secondary]="currentRoute !== 'registro'"
              [class.hover:text-text]="currentRoute !== 'registro'">
        <div class="w-12 h-10 sm:w-12 sm:h-12 rounded-2xl flex items-center justify-center transition-colors"
             [class.bg-primary/10]="currentRoute === 'registro'">
          <ion-icon name="add-outline" class="text-xl sm:text-2xl"></ion-icon>
        </div>
      </button>
      <button (click)="navigateTo('calculator')" 
              class="flex flex-col items-center gap-1 active:scale-95 transition-all bg-transparent border-none outline-none"
              [class.text-primary]="currentRoute === 'calculator'"
              [class.text-secondary]="currentRoute !== 'calculator'"
              [class.hover:text-text]="currentRoute !== 'calculator'">
        <div class="w-12 h-10 sm:w-12 sm:h-12 rounded-2xl flex items-center justify-center transition-colors"
             [class.bg-primary/10]="currentRoute === 'calculator'">
          <ion-icon name="calculator-outline" class="text-xl sm:text-2xl"></ion-icon>
        </div>
      </button>
      <button (click)="navigateTo('chat')" 
              class="flex flex-col items-center gap-1 active:scale-95 transition-all bg-transparent border-none outline-none"
              [class.text-primary]="currentRoute === 'chat'"
              [class.text-secondary]="currentRoute !== 'chat'"
              [class.hover:text-text]="currentRoute !== 'chat'">
        <div class="w-12 h-10 sm:w-12 sm:h-12 rounded-2xl flex items-center justify-center transition-colors"
             [class.bg-primary/10]="currentRoute === 'chat'">
          <ion-icon name="chatbubble-outline" class="text-xl sm:text-2xl"></ion-icon>
        </div>
      </button>
      <button (click)="navigateTo('profile')" 
              class="flex flex-col items-center gap-1 active:scale-95 transition-all bg-transparent border-none outline-none"
              [class.text-primary]="currentRoute === 'profile'"
              [class.text-secondary]="currentRoute !== 'profile'"
              [class.hover:text-text]="currentRoute !== 'profile'">
        <div class="w-12 h-10 sm:w-12 sm:h-12 rounded-2xl flex items-center justify-center transition-colors"
             [class.bg-primary/10]="currentRoute === 'profile'">
          <ion-icon name="person-outline" class="text-xl sm:text-2xl"></ion-icon>
        </div>
      </button>
    </div>
  }
</ion-app>
