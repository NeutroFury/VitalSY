<ion-content class="ion-padding auth-content">
  <div class="auth-container">
    <!-- Header/Logo -->
    <div class="logo-container">
      <div class="logo-circle">
        <ion-icon name="pulse" color="light"></ion-icon>
      </div>
      <h1 class="app-title">VitalSY</h1>
      <p class="app-subtitle">Crea tu nueva contraseña</p>
    </div>

    <!-- Contenido cuando no hay token -->
    <div *ngIf="!token" class="error-container">
      <ion-icon name="alert-circle-outline" color="danger"></ion-icon>
      <h2>Enlace no válido</h2>
      <p>No pudimos encontrar el código de seguridad. Por favor, solicita un nuevo cambio de contraseña desde la pantalla de inicio.</p>
      <ion-button expand="block" shape="round" color="primary" routerLink="/login" routerDirection="back">
        Volver a inicio
      </ion-button>
    </div>

    <!-- Formulario de reset (solo si hay token) -->
    <form *ngIf="token" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <div class="input-wrapper" [class.focused]="isNewPasswordFocused">
          <ion-item class="custom-input" lines="none">
            <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
            <ion-input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="newPassword"
              name="newPassword"
              placeholder="Nueva contraseña"
              required
              minlength="6"
              (ionFocus)="isNewPasswordFocused = true"
              (ionBlur)="isNewPasswordFocused = false">
            </ion-input>
            <ion-icon 
              [name]="showPassword ? 'eye-off' : 'eye'" 
              slot="end" 
              class="password-toggle"
              (click)="togglePassword()">
            </ion-icon>
          </ion-item>
        </div>
        <div class="input-hint">Mínimo 6 caracteres</div>
      </div>

      <div class="form-group">
        <div class="input-wrapper" [class.focused]="isConfirmPasswordFocused">
          <ion-item class="custom-input" lines="none">
            <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
            <ion-input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              placeholder="Confirmar contraseña"
              required
              (ionFocus)="isConfirmPasswordFocused = true"
              (ionBlur)="isConfirmPasswordFocused = false">
            </ion-input>
          </ion-item>
        </div>
      </div>

      <!-- Botón Submit -->
      <ion-button 
        type="submit" 
        expand="block" 
        shape="round" 
        class="submit-btn" 
        [disabled]="isSubmitting || !newPassword || !confirmPassword">
        <span *ngIf="!isSubmitting">Guardar contraseña</span>
        <ion-spinner *ngIf="isSubmitting" name="crescent"></ion-spinner>
      </ion-button>
    </form>
  </div>
</ion-content>
